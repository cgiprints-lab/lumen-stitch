name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # The standalone tools: manager CLI + gigapixel stitcher, with the seam /
  # downsample / 360 / stereo acceptance tests, on every supported platform.
  tools:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure core
        run: cmake -S core -B build/core
      - name: Configure stitcher
        run: cmake -S stitcher -B build/stitcher
      - name: Build
        run: |
          cmake --build build/core --config RelWithDebInfo
          cmake --build build/stitcher --config RelWithDebInfo
      - name: Acceptance tests
        run: build/stitcher/RelWithDebInfo/seam_test "$RUNNER_TEMP"
        shell: bash
        if: matrix.os == 'windows-latest'
      - name: Acceptance tests
        run: build/stitcher/seam_test "$RUNNER_TEMP"
        shell: bash
        if: matrix.os != 'windows-latest'

  # The in-game mod: artifact matrix per platform x Dusklight version. MSVC
  # Windows, GCC Linux, Clang macOS each produce a loadable .dusk (the SDK
  # puts mod metadata in PE/ELF/Mach-O sections). The version axis is the
  # service-version fallback matrix: compiling clean against older 2.0.x
  # tags is what lets one artifact family serve the whole line, with the
  # mod's runtime feature flags degrading on missing APIs (never below the
  # 1x capture floor). Android artifacts need the NDK toolchain and are
  # intentionally not on hosted runners yet.
  mod:
    strategy:
      fail-fast: false
      matrix:
        # Explicit cross product: include entries paired with a matrix list
        # do NOT multiply (run 4578587160 proved GitHub folds them 1:1),
        # so enumerate all 9 platform x version combos.
        include:
          - { os: windows-latest, platform: windows-x64, dusklight: v2.0.1 }
          - { os: windows-latest, platform: windows-x64, dusklight: v2.0.2 }
          - { os: windows-latest, platform: windows-x64, dusklight: v2.0.3 }
          - { os: ubuntu-latest,  platform: linux-x64,   dusklight: v2.0.1 }
          - { os: ubuntu-latest,  platform: linux-x64,   dusklight: v2.0.2 }
          - { os: ubuntu-latest,  platform: linux-x64,   dusklight: v2.0.3 }
          - { os: macos-latest,   platform: macos-arm64, dusklight: v2.0.1 }
          - { os: macos-latest,   platform: macos-arm64, dusklight: v2.0.2 }
          - { os: macos-latest,   platform: macos-arm64, dusklight: v2.0.3 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        # Quotes matter: the default Windows shell (pwsh) splits an unquoted
        # -DNAME=v2.0.2 at the '=', handing CMake "v2" (run 45789209300).
        run: cmake -S adapters/dusklight/mod -B build/mod "-DDUSKLIGHT_VERSION=${{ matrix.dusklight }}"
      - name: Build
        run: cmake --build build/mod --config RelWithDebInfo
      - name: Upload .dusk (baseline build)
        uses: actions/upload-artifact@v4
        if: matrix.dusklight == 'v2.0.2'
        with:
          name: lumen_photo-${{ matrix.platform }}
          path: build/mod/mods/*.dusk

  # Longshot adapter: the integration is a folder mod (TypeScript, compiled
  # by the game at load) - CI stages the bundle and guards the tile-math
  # equivalence between the mod's TS planner and common/tilemath.h. There is
  # no native compile and no macOS/Android axis: Longshot ships Windows and
  # Linux only. `Longshot.exe mod check/test` needs a game dump and stays a
  # manual (documented) step.
  mod-longshot:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the mod bundle
        run: cmake -S adapters/longshot/mod -B build/longshot
      - name: Build bundle
        run: cmake --build build/longshot
      - name: Build tile-math fixture (C++)
        run: |
          cmake -S adapters/longshot/tests -B build/longshot-tests
          cmake --build build/longshot-tests
      - name: Tile-math equivalence (TS vs C++)
        run: |
          node --experimental-strip-types adapters/longshot/tests/equiv_test.ts build/longshot-tests/gen_tiles_cpp || \
            node adapters/longshot/tests/equiv_test.ts build/longshot-tests/gen_tiles_cpp
        shell: bash
        if: matrix.os != 'windows-latest'
      - name: Tile-math equivalence (Windows)
        run: |
          node --experimental-strip-types adapters/longshot/tests/equiv_test.ts build/longshot-tests/gen_tiles_cpp.exe || `
            node adapters/longshot/tests/equiv_test.ts build/longshot-tests/gen_tiles_cpp.exe
        shell: pwsh
        if: matrix.os == 'windows-latest'
      - name: Upload the mod folder (bundle)
        uses: actions/upload-artifact@v4
        with:
          name: lumen-photo-longshot-${{ matrix.os }}
          path: build/longshot/mods/lumen-photo
