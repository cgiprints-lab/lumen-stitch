name: build

on:
  push:
  pull_request:

jobs:
  manager:
    name: Lumen Manager (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S core -B build/core
      - name: Build
        run: cmake --build build/core
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ matrix.os }}
          path: build/core/lumen*

  dusklight-mod:
    name: Dusklight integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S adapters/dusklight/mod -B build/mod -G Ninja
      - name: Build
        run: cmake --build build/mod --target lumen_photo
      - uses: actions/upload-artifact@v4
        with:
          name: lumen_photo-${{ matrix.os }}
          path: build/mod/mods/lumen_photo.dusk
